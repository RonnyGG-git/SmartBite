{% extends "base.html" %}
{% block title %}QR mesa {{ mesa.numero }} — Smart Bite{% endblock %}
{% block content %}
<a href="{% url 'operativo:mesas_list' %}" class="back-link no-print"><svg class="ico ico-sm"><use href="#i-arrow-left"/></svg>Mesas</a>
<div class="page-header">
  <div>
    <span class="eyebrow">Mesa {{ mesa.numero }}</span>
    <h1>Código QR del menú</h1>
    <p>El cliente escanea este código para ver el menú de la sucursal.</p>
  </div>
  <div class="page-actions no-print">
    <button type="button" class="btn btn-secondary" data-action="print"><svg class="ico"><use href="#i-printer"/></svg><span>Imprimir</span></button>
  </div>
</div>
<div class="card narrow">
  <div class="qr-frame">
    <img src="data:image/png;base64,{{ qr_base64 }}" alt="Código QR que abre el menú de la mesa {{ mesa.numero }}">
  </div>
  <p class="qr-url">{{ url_menu }}</p>
</div>
{% endblock %}
