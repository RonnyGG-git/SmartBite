{% extends "base.html" %}
{% block title %}Confirmar eliminación{% endblock %}
{% block content %}
<div class="card" style="max-width:480px; margin:60px auto;">
  <h2 style="margin-top:0;">¿Eliminar {{ object }}?</h2>
  <p style="color:#9ca3af;">Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <a href="javascript:history.back()" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-danger">Eliminar</button>
    </div>
  </form>
</div>
{% endblock %}
