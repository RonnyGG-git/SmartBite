{% extends "base.html" %}
{% block title %}Confirmar eliminación — Smart Bite{% endblock %}
{% block content %}
<div class="card confirm">
  <span class="confirm-icon"><svg class="ico ico-lg"><use href="#i-trash"/></svg></span>
  <h1>¿Eliminar «{{ object }}»?</h1>
  <p>Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <a href="#" class="btn btn-ghost" data-action="back">Cancelar</a>
      <button type="submit" class="btn btn-danger"><svg class="ico"><use href="#i-trash"/></svg><span>Eliminar</span></button>
    </div>
  </form>
</div>
{% endblock %}
