services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - media:/app/media
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  media:
  caddy_data:
  caddy_config:
